name: Publish Skills to Tessl

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Tessl Workspace
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Validate skill catalog
        run: |
          python3 scripts/sync_sinch_skill_references.py --check
          python3 scripts/validate_sinch_skills.py

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_API_KEY }}

      # --bump patch lets the registry auto-increment when the manifest version
      # already exists, so re-running this workflow can never collide the way
      # the old 1.0.<run_number> scheme did (run_number is stable across re-runs).
      - run: tessl tile publish --bump patch
